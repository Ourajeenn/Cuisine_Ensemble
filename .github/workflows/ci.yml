name: CuisineEnsemble CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cuisineensemble-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cuisineensemble
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # Stage 1: Validate Code Quality
  validate:
    name: "Stage 1: Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Unit tests
        run: npm run test:unit -- --run
        
      - name: Coverage report
        run: npm run test:coverage -- --run
        
      - name: Security scan (Semgrep)
        continue-on-error: true
        run: |
          npm install -g semgrep
          semgrep --config auto --severity ERROR --exclude coverage --exclude dist --exclude node_modules .

  # Stage 2: Build Application
  build:
    name: "Stage 2: Build"
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

  # Stage 3: Build Docker Image
  docker-build:
    name: "Stage 3: Build Docker Image"
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -f Dockerfile .

      - name: Test Docker image
        run: |
          docker run --rm -d \
            -p 3000:3000 \
            --name test-app \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          sleep 5
          curl -f http://localhost:3000/health && echo "Health check passed" || exit 1
          docker stop test-app

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  # Stage 4: Deploy to Fly.io
  deploy-flyio:
    name: "Stage 4: Deploy to Fly.io"
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@master
        with:
          args: "deploy --local-only"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment health
        run: |
          echo "Waiting for app to be healthy..."
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://cuisineensemble-app.fly.dev/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Deployment successful!"
              exit 0
            fi
            echo "Attempt $i/30: HTTP $HTTP_CODE"
            sleep 2
          done
          echo "❌ App did not become healthy"
          exit 1

  # Stage 5: Verify Services
  verify:
    name: "Stage 5: Verify Services"
    needs: deploy-flyio
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check Health Endpoint
        run: |
          curl -f https://cuisineensemble-app.fly.dev/health || exit 1
          echo "✅ Health check passed"

      - name: Check Metrics Endpoint
        run: |
          curl -f https://cuisineensemble-app.fly.dev/metrics || exit 1
          echo "✅ Metrics endpoint working"

      - name: Smoke Test
        run: |
          curl -f https://cuisineensemble-app.fly.dev/ || exit 1
          echo "✅ App responding"
