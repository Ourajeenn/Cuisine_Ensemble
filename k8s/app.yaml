---
# CuisineEnsemble App Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuisineensemble-app
  namespace: cuisineensemble
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: cuisineensemble
  template:
    metadata:
      labels:
        app: cuisineensemble
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - cuisineensemble
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cuisineensemble
          image: cuisineensemble:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: web
          env:
            - name: NODE_ENV
              value: production
            - name: VITE_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: supabase-url
            - name: VITE_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: supabase-anon-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]

---
# CuisineEnsemble Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: cuisineensemble
  namespace: cuisineensemble
  labels:
    app: cuisineensemble
spec:
  type: ClusterIP
  selector:
    app: cuisineensemble
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: web

---
# CuisineEnsemble Service (NodePort for external access)
apiVersion: v1
kind: Service
metadata:
  name: cuisineensemble-nodeport
  namespace: cuisineensemble
  labels:
    app: cuisineensemble
spec:
  type: NodePort
  selector:
    app: cuisineensemble
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
      protocol: TCP
      name: web

---
# CuisineEnsemble HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cuisineensemble-hpa
  namespace: cuisineensemble
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cuisineensemble-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 60

---
# NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cuisineensemble
  namespace: cuisineensemble
spec:
  podSelector:
    matchLabels:
      app: cuisineensemble
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443   # HTTPS for external APIs
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53    # DNS
