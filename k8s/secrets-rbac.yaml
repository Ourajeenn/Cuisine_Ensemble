---
# ServiceAccount for Prometheus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: cuisineensemble

---
# ClusterRole for Prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - apps
    resources:
      - statefulsets
      - daemonsets
      - deployments
      - replicasets
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

---
# ClusterRoleBinding for Prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: cuisineensemble

---
# Secrets for app
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: cuisineensemble
type: Opaque
stringData:
  supabase-url: "https://your-project.supabase.co"
  supabase-anon-key: "your-anon-key"
  database-url: "postgresql://cuisineensemble:cuisineensemble-password@postgres:5432/cuisineensemble"

---
# Secrets for PostgreSQL
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: cuisineensemble
type: Opaque
stringData:
  password: "cuisineensemble"

---
# Secrets for Grafana
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: cuisineensemble
type: Opaque
stringData:
  password: "admin"
