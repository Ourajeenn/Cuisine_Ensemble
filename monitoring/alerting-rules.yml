groups:
  - name: cuisineensemble.rules
    rules:
      - alert: AppDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Service application down

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High error rate detected
