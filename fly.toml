# Fly.io Configuration - CuisineEnsemble
app = "cuisineensemble-app"
primary_region = "syd"

[env]
NODE_ENV = "production"
PORT = "3000"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = true
auto_start_machines = true

[[services]]
protocol = "tcp"
internal_port = 3000

  [[services.ports]]
  port = 80
  handlers = ["http"]

  [[services.ports]]
  port = 443
  handlers = ["tls", "http"]

  [services.concurrency]
  type = "requests"
  hard_limit = 1000
  soft_limit = 200

  [services.tcp_checks]
  grace_period = "30s"
  interval = "15s"
  timeout = "10s"

[metrics]
port = 3000
path = "/metrics"
