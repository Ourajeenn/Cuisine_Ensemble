app = "cuisineensemble-app"
primary_region = "syd"

[env]
NODE_ENV = "production"
PORT = "8080"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8080

[[metrics]]
path = "/metrics"
port = 8080

[[services]]
internal_port = 8080
protocol = "tcp"

  [services.concurrency]
  hard_limit = 1000
  soft_limit = 200
  type = "requests"

  [[services.ports]]
  handlers = ["http"]
  port = 80

  [[services.ports]]
  handlers = ["tls", "http"]
  port = 443

  [[services.tcp_checks]]
  grace_period = "30s"
  interval = "15s"
  timeout = "10s"
