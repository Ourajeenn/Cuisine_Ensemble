- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Copy application compose file
  ansible.builtin.copy:
    src: "../../../../../docker-compose.CuisineEnsemble.yml"
    dest: "{{ app_dir }}/{{ app_compose_file }}"
    mode: "0644"

- name: Copy monitoring compose file
  ansible.builtin.copy:
    src: "../../../../../docker-compose.monitoring.yml"
    dest: "{{ app_dir }}/{{ monitoring_compose_file }}"
    mode: "0644"
