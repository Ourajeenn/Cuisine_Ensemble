name: CuisineEnsemble CI/CD - Fast Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cuisineensemble-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cuisineensemble
  IMAGE_TAG: ${{ github.sha }}
  CACHE_VERSION: 1

jobs:
  # Quick validation (2-3 min)
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --prefer-offline --no-audit

      - run: npm run lint --max-warnings=0

      - run: npm run test:unit -- --run --passWithNoTests

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          compression-level: 9

  # Docker build & push (2-3 min) - only on main
  deploy:
    name: Deploy to Fly.io
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy
        uses: superfly/flyctl-actions@master
        with:
          args: "deploy --local-only"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health Check
        run: |
          for i in {1..30}; do
            if curl -f https://cuisineensemble-app.fly.dev/health >/dev/null 2>&1; then
              echo "✅ App healthy"
              exit 0
            fi
            echo "Wait $i/30..."
            sleep 2
          done
          exit 1

  # Tests only on main after deploy (optional, can skip)
  test:
    name: Smoke Tests
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --prefer-offline --no-audit

      - name: E2E Tests
        timeout-minutes: 5
        run: npm run test:e2e || true
