apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    access: proxy
    editable: true
    jsonData:
      scrapeInterval: 15s
      queryTimeout: 5s

  - name: Loki
    type: loki
    url: http://loki:3100
    access: proxy
    editable: true
    isDefault: false
