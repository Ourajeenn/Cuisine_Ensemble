# fly.toml app configuration file generated for cuisineensemble-app on 2026-07-12T23:30:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "cuisineensemble-app"
primary_region = "syd"

[env]
NODE_ENV = "production"
PORT = "3000"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
  min_machines_running = 1

[[services]]
protocol = "tcp"
internal_port = 3000

  [[services.ports]]
  port = 80
  handlers = ["http"]

  [[services.ports]]
  port = 443
  handlers = ["tls", "http"]

  [services.concurrency]
  type = "requests"
  hard_limit = 1000
  soft_limit = 200

  [services.tcp_checks]
  grace_period = "30s"
  interval = "15s"
  timeout = "10s"

[metrics]
port = 3000
path = "/metrics"
