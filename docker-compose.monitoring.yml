version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: cuisineensemble-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: cuisineensemble-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${APP_DATA_ROOT:-./data/prod}/grafana:/var/lib/grafana
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    container_name: cuisineensemble-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
